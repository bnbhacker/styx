[profile.default]
src = "."
test = "test"
out = "forge-out"
cache_path = "forge-cache"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
skip = ["lib/**"]

[lint]
lint_on_build = false

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false
show_metrics = true

[rpc_endpoints]
rh = "https://rpc.mainnet.chain.robinhood.com"
elysium = "https://testnet-rpc.elysium.kinetiq.xyz"
